name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate
        run: |
          python3 scripts/validate.py
          python3 -m unittest discover -s tests
          bash tests/test_install.sh

      - name: Verify tag matches skill version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match plugin version v${version}" >&2
            exit 1
          fi

      - name: Build archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          (cd skills && zip -r "../dist/clean-code-${TAG}.zip" clean-code)

      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="${version}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" "dist/clean-code-${TAG}.zip" \
            --title "${TAG}" --notes-file dist/notes.md --verify-tag
